<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دمج محافظ اللوحات</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--ac:#1d4ed8;--bd:#d9dde3;--ok:#15803d;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mut:#9aa3af;--ac:#6b9bff;--bd:#2f3742;--ok:#4ade80;--er:#f87171}}
:root[data-theme="dark"]{--bg:#111418;--card:#1b2027;--tx:#e8eaed;--mut:#9aa3af;--ac:#6b9bff;--bd:#2f3742;--ok:#4ade80;--er:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6;padding:12px}
h1{font-size:1.25rem;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:1rem;margin:0 0 8px}
input[type=file],select,input[type=text]{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem;margin:4px 0}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:1rem;width:100%;margin-top:8px}
button:disabled{opacity:.5}
.mut{color:var(--mut);font-size:.88rem}
.ok{color:var(--ok)}.er{color:var(--er)}
.own{display:flex;flex-direction:column;gap:8px;align-items:stretch;padding:12px 0;border-top:1px solid var(--bd);min-width:0;width:100%}
.own-actions{display:flex;align-items:center;justify-content:flex-start;gap:10px;flex-wrap:wrap;width:100%;min-width:0}
.own-actions .op{width:auto!important;min-width:112px;max-width:48%;flex:0 1 160px!important;margin:0}
.own-actions input[type=checkbox]{width:22px;height:22px;margin:0;flex:none;accent-color:var(--ac)}
.own-actions .exclude-owner-label{display:flex;align-items:center;gap:6px;white-space:normal;line-height:1.4;max-width:100%;font-size:.84rem!important}
.own-info{width:100%;min-width:0;overflow-wrap:anywhere;word-break:normal}
.own-info b{display:inline-block;max-width:100%;overflow-wrap:anywhere}
.own-info .mut{display:inline-block;max-width:100%;line-height:1.7}
/* Keep collapsed plate lists hidden; .own-info .mut otherwise overrides the browser hidden rule. */
.mut[hidden]{display:none!important}
.own-info .vb{display:inline-block;max-width:100%;white-space:normal}
.paste-plate-list{max-height:260px;overflow-y:auto;border:1px solid var(--bd);border-radius:8px;margin:8px 0;background:var(--bg)}
.paste-plate-row{display:grid;grid-template-columns:minmax(88px,.8fr) minmax(0,1.2fr);gap:7px;align-items:center;padding:4px 7px;border-bottom:1px solid var(--bd);font-size:.84rem}
.paste-plate-row:last-child{border-bottom:0}
.paste-plate-number{font-weight:600;overflow-wrap:anywhere}
input.paste-type{width:100%;min-width:0;margin:0;padding:5px 7px;font-size:.82rem;border-radius:6px}
label{display:block}
#log{white-space:pre-wrap;font-size:.92rem}
</style>
</head>
<body>
<h1>دمج محافظ اللوحات <span class="mut" style="font-size:.7rem">v25</span></h1>

<div class="card">
<h2>١) الشيت الأساسي المجمع (xlsx)</h2>
<input type="file" id="mainf" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet">
<div id="mainInfo" class="mut"></div>

<button id="saveBtn" type="button" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">📤 مشاركة آخر شيت</button>
<button id="restoreBtn" hidden>استرجاع آخر شيت محفوظ</button>
<div id="cols" hidden>
<label class="mut">عمود اللوحة<select id="pcol"></select></label>
<label class="mut">عمود المالك<select id="ocol"></select></label>
</div>
</div>

<div class="card">
<h2>٢) المحافظ المحدثة (يمكن اختيار أكثر من ملف)</h2>
<input type="file" id="walf" multiple disabled accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv">
<div id="walInfo" class="mut"></div>
<div class="mut">يتم تنظيف اللوحة تلقائياً: حذف المسافات والشرطات، الحروف قبل الأرقام، وتوحيد الأرقام.</div>
</div>

<div class="card"><h2>أو الصق لوحات بدل رفع ملف</h2>
<textarea id="paste" rows="5" placeholder="الصق اللوحات هنا، لوحة في كل سطر. ولو نسخت جدول من إكسل هيتعرف على الأعمدة تلقائياً" style="width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:1rem"></textarea>
<label class="mut">الإجراء بعد اللصق<select id="pasteMode"><option value="add">إضافة اللوحات لمالك معيّن</option><option value="del">حذف اللوحات من أصحابها</option></select></label>
<button id="pasteBtn">تجهيز اللوحات</button></div>
<div id="wallets"></div>
<datalist id="dl"></datalist>

<div class="card" id="applyBox" hidden>
<button id="applyBtn">٣) تنفيذ</button>
<div id="log"></div>
<button id="dlBtn" hidden>📤 مشاركة الملف المحدث</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const AR="٠١٢٣٤٥٦٧٨٩",PE="۰۱۲۳۴۵۶۷۸۹";
const RX_P=/لوح|plate/i,RX_O=/مالك|ملك|owner|عميل|بنك|اسم/i,RX_C=/هيكل|شاسي|شاص|chassis|vin/i;
let S=null,W=[];

// Saudi plate letter transliteration (English keyboard form -> Arabic plate letters).
// V is used for ي/ى; Arabic ى is canonicalised to ي.
const LA={A:"ا",B:"ب",J:"ح",D:"د",E:"ع",G:"ق",K:"ك",L:"ل",V:"ي",R:"ر",S:"س",X:"ص",T:"ط",N:"ن",Z:"م",H:"ه",U:"و"};
const AR_PLATE_LETTERS=new Set(Object.values(LA));
function norm(s){
  s=String(s==null?"":s).replace(/\u0640/g,"").replace(/[٠-٩]/g,d=>AR.indexOf(d)).replace(/[۰-۹]/g,d=>PE.indexOf(d)).replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").toUpperCase();
  const raw=(s.match(/[\u0621-\u064A\u0671A-Z]/g)||[]).join("");
  let L="";
  if(/^[A-Z]{3}$/.test(raw)&&[...raw].every(c=>LA[c]))L=[...raw].reverse().map(c=>LA[c]).join("");
  else if(/^[\u0621-\u064A\u0671]{3}$/.test(raw)&&[...raw].every(c=>AR_PLATE_LETTERS.has(c)))L=raw;
  const D=(s.match(/[0-9]/g)||[]).join("");
  const valid=L.length===3&&D.length===4;
  return {L:valid?L:"",D:valid?D:"",key:valid?L+D:""};
}
function isSaudiPlateValue(value){return !!norm(value).key;}
function pickPlateCol(heads,data,cand){
  const N=data.slice(0,500);
  const stat=heads.map((_,c)=>{let v=0;N.forEach(r=>{if(isSaudiPlateValue(r[c]))v++});return {v}});
  // الاسم الصريح لعمود رقم اللوحة له الأولوية، لكن لا نقبل أي عمود لا يحتوي لوحات سعودية صحيحة.
  const explicit=cand.map(c=>({c,v:stat[c]?.v||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  if(explicit.length)return explicit[0].c;
  let pi=-1,bn=0;stat.forEach((x,c)=>{if(x.v>bn){bn=x.v;pi=c}});
  return pi;
}
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function ctext(c){try{return String(c.text==null?"":c.text).trim()}catch(e){return ""}}
function log(t){$("log").textContent=t}

$("mainf").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  $("mainInfo").textContent="جاري قراءة الشيت الأساسي… قد يستغرق دقيقة";
  try{
    const wb=new ExcelJS.Workbook();const buf=await f.arrayBuffer();await wb.xlsx.load(buf);
    let best=null;
    wb.worksheets.forEach(w=>{
      for(let r=1;r<=Math.min(30,w.rowCount);r++){
        const hs=[];for(let c=1;c<=w.columnCount;c++)hs.push(ctext(w.getRow(r).getCell(c)));
        const u=new Set(hs.filter(Boolean));
        const sc=u.size+Math.min(w.rowCount/500,100)+(hs.some(t=>RX_P.test(t))?20:0)+(hs.some(t=>RX_O.test(t))?10:0)+(hs.some(t=>RX_C.test(t))?10:0);
        if(!best||sc>best.sc||(sc===best.sc&&w.rowCount>best.w.rowCount))best={w,r,hs,sc};
      }
    });
    const ws=best.w,h=best.r,heads=best.hs;
    S={wb,ws,h,heads,sheetName:ws.name,bytes:new Uint8Array(buf),fileName:f.name==="saved.xlsx"?"الشيت المحفوظ":f.name};
    const opts=heads.map((t,i)=>`<option value="${i+1}">${esc(t||"عمود "+(i+1))}</option>`).join("");
    $("pcol").innerHTML=opts;$("ocol").innerHTML=opts;
    const pi=heads.findIndex(t=>RX_P.test(t)),oi=heads.findIndex(t=>RX_O.test(t));
    if(pi>=0)$("pcol").value=pi+1;if(oi>=0)$("ocol").value=oi+1;
    $("cols").hidden=(pi>=0&&oi>=0);
    buildIndex();
    try{await DB.set("main",S.bytes)}catch(e){}$("walf").disabled=false;
  }catch(err){$("mainInfo").innerHTML='<span class="er">تعذرت قراءة الملف: '+esc(err.message)+" (يجب أن يكون xlsx)</span>"}
};
$("pcol").onchange=$("ocol").onchange=()=>{buildIndex();W.forEach(analyze);renderWallets()};

function buildIndex(){
  const pc=+$("pcol").value,oc=+$("ocol").value;
  S.pc=pc;S.oc=oc;S.idx=new Map();S.byOwner=new Map();S.ar=false;S.dump=[];
  for(let r=S.h+1;r<=S.ws.rowCount;r++){
    const row=S.ws.getRow(r),p=ctext(row.getCell(pc));if(!p)continue;
    const o=ctext(row.getCell(oc)),k=norm(p).key;if(!k)continue;S.dump.push([r,k,o]);
    if(!S.idx.has(k))S.idx.set(k,new Set());S.idx.get(k).add(o);
    if(!S.byOwner.has(o))S.byOwner.set(o,[]);S.byOwner.get(o).push(r);
    if(/[٠-٩]/.test(p))S.ar=true;
  }
  let n=0;S.idx.forEach(()=>n++);let rows=0;S.byOwner.forEach(a=>rows+=a.length);
  $("mainInfo").innerHTML='<span class="ok">تم: '+rows+" صف ("+n+" لوحة مختلفة)، "+S.byOwner.size+" مالك · ورقة: "+esc(S.ws.name)+" · صف العناوين: "+S.h+"<br>الملف: "+esc(S.fileName||"")+" · "+new Date().toLocaleString("ar-EG")+"</span>";
  try{DB.set("index",{pc:S.pc,oc:S.oc,h:S.h,heads:S.heads,sheetName:S.sheetName,ar:S.ar,dump:S.dump,name:S.fileName,at:Date.now(),v:4})}catch(e){}
  $("dl").innerHTML=[...S.byOwner.keys()].map(o=>`<option value="${esc(o)}">`).join("");
}

const _cat=(...a)=>{const n=a.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const _b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const _u32=i=>{const c=new Uint8Array(4);new DataView(c.buffer).setUint32(0,i,true);return c};
async function decryptAgile(info,pkg,pw){
  if(!(info[0]===4&&info[1]===0&&info[2]===4&&info[3]===0))throw new Error("UNSUP");
  const xml=new TextDecoder().decode(info.subarray(8));
  const tag=n=>{const m=xml.match(new RegExp("<(?:[\\w]+:)?"+n+"\\b[^>]*>"));if(!m)throw new Error("UNSUP");return m[0]};
  const at=(t,n)=>{const m=t.match(new RegExp("\\b"+n+'="([^"]*)"'));if(!m)throw new Error("UNSUP");return m[1]};
  const kd=tag("keyData"),ek=tag("encryptedKey");
  const HA={SHA512:"SHA-512",SHA384:"SHA-384",SHA256:"SHA-256",SHA1:"SHA-1"};
  if(at(kd,"cipherAlgorithm")!=="AES"||at(kd,"cipherChaining")!=="ChainingModeCBC")throw new Error("UNSUP");
  const alg=HA[at(ek,"hashAlgorithm")],kdAlg=HA[at(kd,"hashAlgorithm")];
  if(!alg||!kdAlg)throw new Error("UNSUP");
  const spin=+at(ek,"spinCount"),bits=+at(ek,"keyBits"),hashSize=+at(ek,"hashSize");
  const ekSalt=_b64(at(ek,"saltValue")),kdSalt=_b64(at(kd,"saltValue"));
  const dig=async(a,d)=>new Uint8Array(await crypto.subtle.digest(a,d));
  const dec=async(key,iv,data)=>{
    const n=Math.floor(data.length/16)*16;if(!n)return new Uint8Array(0);
    data=data.subarray(0,n);
    const pad=new Uint8Array(await crypto.subtle.encrypt({name:"AES-CBC",iv:data.subarray(n-16)},key,new Uint8Array(0)));
    return new Uint8Array(await crypto.subtle.decrypt({name:"AES-CBC",iv},key,_cat(data,pad.subarray(0,16))));
  };
  const imp=raw=>crypto.subtle.importKey("raw",raw,"AES-CBC",false,["encrypt","decrypt"]);
  const pwb=new Uint8Array(pw.length*2);for(let i=0;i<pw.length;i++){const c=pw.charCodeAt(i);pwb[2*i]=c&255;pwb[2*i+1]=c>>8}
  let h=await dig(alg,_cat(ekSalt,pwb));
  for(let i=0;i<spin;i++)h=await dig(alg,_cat(_u32(i),h));
  const derive=async bk=>{const x=await dig(alg,_cat(h,Uint8Array.from(bk)));const n=bits/8;if(x.length>=n)return imp(x.subarray(0,n));const o=new Uint8Array(n).fill(0x36);o.set(x);return imp(o)};
  const vin=await dec(await derive([0xfe,0xa7,0xd2,0x76,0x3b,0x4b,0x9e,0x79]),ekSalt,_b64(at(ek,"encryptedVerifierHashInput")));
  const vh=await dec(await derive([0xd7,0xaa,0x0f,0x6d,0x30,0x61,0x34,0x4e]),ekSalt,_b64(at(ek,"encryptedVerifierHashValue")));
  const calc=await dig(alg,vin.subarray(0,+at(ek,"saltSize")));
  for(let i=0;i<hashSize;i++)if(calc[i]!==vh[i])throw new Error("BADPW");
  const kv=await dec(await derive([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]),ekSalt,_b64(at(ek,"encryptedKeyValue")));
  const key=await imp(kv.subarray(0,bits/8));
  const size=Number(new DataView(pkg.buffer,pkg.byteOffset,8).getBigUint64(0,true));
  const data=pkg.subarray(8),parts=[];
  for(let i=0,p=0;p<data.length;i++,p+=4096){
    const iv=(await dig(kdAlg,_cat(kdSalt,_u32(i)))).subarray(0,16);
    parts.push(await dec(key,iv,data.subarray(p,Math.min(p+4096,data.length))));
  }
  return _cat(...parts).subarray(0,size);
}

function askPw(name,tryFn){return new Promise((res,rej)=>{
  const m=document.createElement("div");
  m.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:99;padding:16px";
  m.innerHTML='<div class="card" style="width:100%;max-width:420px;margin:0"><h2>🔒 الملف محمي برقم سري</h2><div class="mut" style="word-break:break-word">'+esc(name)+'</div><input type="password" id="pwI" placeholder="اكتب الرقم السري" autocomplete="off"><div id="pwE" style="min-height:1.5em;margin:4px 0"></div><div style="display:flex;gap:8px"><button id="pwOk" type="button">فتح</button><button id="pwNo" type="button" style="background:transparent;color:var(--ac);border:1px solid var(--ac)">إلغاء</button></div></div>';
  document.body.appendChild(m);
  const I=m.querySelector("#pwI"),E=m.querySelector("#pwE"),B=m.querySelector("#pwOk");
  setTimeout(()=>I.focus(),50);
  const go=async()=>{
    if(!I.value||B.disabled)return;
    B.disabled=true;E.className="mut";E.textContent="جاري فتح الملف… (ممكن ياخد كام ثانية)";
    await new Promise(r=>setTimeout(r,30));
    try{await tryFn(I.value);m.remove();res()}
    catch(e){
      if(e.message==="UNSUP"){m.remove();rej(e);return}
      B.disabled=false;E.className="er";E.textContent="الرقم السري غلط، جرّب تاني";I.select();
    }
  };
  B.onclick=go;I.onkeydown=ev=>{if(ev.key==="Enter")go()};
  m.querySelector("#pwNo").onclick=()=>{m.remove();rej(new Error("CANCEL"))};
})}
async function openProtected(buf,name){
  const u8=new Uint8Array(buf);
  if(!(u8[0]===0xD0&&u8[1]===0xCF&&u8[2]===0x11&&u8[3]===0xE0))return buf;
  let cfb;try{cfb=XLSX.CFB.read(u8,{type:"array"})}catch(e){return buf}
  const ei=XLSX.CFB.find(cfb,"EncryptionInfo"),ep=XLSX.CFB.find(cfb,"EncryptedPackage");
  if(!ei||!ep)return buf;
  const info=Uint8Array.from(ei.content),pkg=Uint8Array.from(ep.content);
  let out=null;
  await askPw(name,async pw=>{out=await decryptAgile(info,pkg,pw)});
  return out.buffer.slice(out.byteOffset,out.byteOffset+out.byteLength);
}

$("walf").onchange=async e=>{
  W=[];
  for(const f of e.target.files){
    let wb;
    try{
      let buf=await openProtected(await f.arrayBuffer(),f.name);
      const ro={type:"array",cellStyles:false,cellNF:false,cellHTML:false};
      try{wb=XLSX.read(buf,ro)}
      catch(err){
        if(!/password|encrypt/i.test(String(err&&err.message)))throw err;
        await askPw(f.name,async pw=>{try{wb=XLSX.read(buf,Object.assign({password:pw},ro))}catch(x){throw new Error("BADPW")}});
      }
    }catch(err){
      if(err.message==="UNSUP")alert("نوع التشفير في الملف ده مش مدعوم: "+f.name+"\nافتحه في إكسل وشيل الرقم السري وارفعه تاني.");
      else if(err.message!=="CANCEL")alert("تعذر قراءة الملف: "+f.name+"\n"+err.message);
      continue;
    }
    // افحص كل أوراق المصنف؛ لا تختَر ورقة العقود لمجرد أن بها عموداً يبدأ بكلمة "رقم".
    const headerRe=/(?:لوحة|رقم\s*اللوحة|plate|owner|مالك|اسم\s*المالك|manufacturer|astassets|مصنع|صانع\s*المركبة|نوع\s*السيارة|نوع\s*المركبة|model|موديل|year|سنة\s*الصنع|chassis|vin|هيكل)/i;
    let chosen=null;
    for(const sheetName of wb.SheetNames){
      const sh=wb.Sheets[sheetName];let mr=0,mc=0;
      for(const k in sh){if(k[0]==="!")continue;const a=XLSX.utils.decode_cell(k);if(a.r>mr)mr=a.r;if(a.c>mc)mc=a.c}
      if(!mr&&!mc)continue;
      sh["!ref"]=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:mr,c:mc}});
      const rows=XLSX.utils.sheet_to_json(sh,{header:1,raw:false,defval:""});
      let h=-1,bestScore=0,bestFilled=0;
      for(let ri=0;ri<Math.min(rows.length,30);ri++){
        const cells=(rows[ri]||[]).map(x=>String(x==null?"":x).trim()).filter(Boolean);
        if(cells.length<2)continue;
        const score=cells.reduce((n,x)=>n+(headerRe.test(x)?1:0),0);
        if(score>bestScore||(score===bestScore&&score>0&&cells.length>bestFilled)){bestScore=score;bestFilled=cells.length;h=ri;}
      }
      const hasHeader=h>=0&&bestScore>=1;
      const heads=hasHeader?(rows[h]||[]).map(String):Array.from({length:Math.max(0,...rows.map(r=>r.length))},(_,c)=>"عمود "+(c+1));
      const rawData=(hasHeader?rows.slice(h+1):rows).filter(r=>r.some(x=>String(x).trim()));
      const cand=heads.map((t,c)=>/رقم\s*اللوحة|لوحة|plate/i.test(t)?c:-1).filter(c=>c>=0);
      const pi=pickPlateCol(heads,rawData,cand);
      const validCount=pi>=0?rawData.filter(r=>isSaudiPlateValue(r[pi])).length:0;
      const explicitPlateHeader=pi>=0&&cand.includes(pi)?1:0;
      const score=validCount*100+explicitPlateHeader*10000;
      if(validCount>0&&(!chosen||score>chosen.score))chosen={sheetName,heads,rawData,pi,validCount,score};
    }
    if(!chosen){alert("لم يتم العثور على عمود يحتوي لوحات سعودية صحيحة (3 حروف عربية و4 أرقام) في الملف: "+f.name);continue;}
    const data=chosen.rawData.filter(r=>isSaudiPlateValue(r[chosen.pi]));
    W.push({name:f.name+" · "+chosen.sheetName,heads:chosen.heads,data,pi:chosen.pi});
  }
  W.forEach(analyze);renderWallets();
  $("walInfo").textContent="تم قراءة: "+W.map(w=>w.name+" ("+w.data.length+" صف)").join("، ");

function normVehicleText(v){
  return String(v==null?"":v).toLowerCase().trim().replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/[ً-ٟـ]/g,"").replace(/[\s_.-]+/g," ").replace(/[^\p{L}\p{N} ]/gu,"").trim();
}
const MAKERS_AR=["تويوتا","هونداي","هيونداي","هوندا","نيسان","شيفروليه","شيفورليه","كيا","مازدا","متسوبيشي","ميتسوبيشي","فورد","جمس","جي ام سي","ايسوزو","سوزوكي","لكزس","مرسيدس","بي ام دبليو","ب ام دبليو","اودي","فولكس واجن","فولكسفاجن","رينو","بيجو","سيتروين","سكودا","جيلي","شانجان","ام جي","شيري","جريت وول","دودج","كرايسلر","جيب","انفينيتي","بورش","لاند روفر","جاكوار","سوبارو","دايهاتسو","فيات","اوبل","بنتلي","فولفو","لينكون","كاديلاك","رام"];
const MAKERS_EN=["toyota","hyundai","honda","nissan","chevrolet","kia","mazda","mitsubishi","ford","gmc","isuzu","suzuki","lexus","mercedes","bmw","audi","volkswagen","vw","renault","peugeot","citroen","skoda","geely","changan","mg","chery","great wall","dodge","chrysler","jeep","infiniti","porsche","land rover","jaguar","subaru","daihatsu","fiat","opel","bentley","volvo","lincoln","cadillac","ram"];
const MODELS_AR=["كامري","كامرى","كورولا","كرولا","يارس","افالون","راف فور","راڤ فور","هايلكس","لاندكروزر","لاند كروزر","برادو","فورتشنر","هايس","جي اكس ار","اكسنت","النترا","سوناتا","توسان","سنتافي","ازيرا","كريتا","اوبتيما","سيراتو","ريو","سبورتاج","كادينزا","بيكانتو","اكورد","سيفيك","سيتي","التيما","صني","باترول","ماكسيما","اكس تريل","نافارا","ددسن","ماليبو","كروز","اوبترا","افيو","تاهو","سوبربان","سيلفرادو","جمس يوكن","يوكن","سيرا","تاهو","اكسبلورر","تورس","فيوجن","رينجر","ايدج","اكس 5","اكس 3","الفئة الخامسة","الفئة الثالثة","سي كلاس","اي كلاس","باترول","بيك اب","بكب غمارة","بكب غمارتين","بكب","شاحنة","فورستر","امبريزا","اوتلاندر","لانسر","باجيرو","ASX"];
const MODELS_EN=["camry","corolla","yaris","avalon","rav4","hilux","land cruiser","prado","fortuner","hiace","accent","elantra","sonata","tucson","santa fe","azera","creta","optima","cerato","rio","sportage","picanto","accord","civic","city","altima","sunny","patrol","maxima","x trail","navara","datsun","malibu","cruze","optra","aveo","tahoe","suburban","silverado","yukon","sierra","explorer","taurus","fusion","ranger","edge","forester","impreza","outlander","lancer","pajero","asx","prius","aurion","fortuner","captiva","spark","trailblazer","mustang","focus","escape","ecosport","c class","e class","3 series","5 series"];
const MAKER_SET=new Set([...MAKERS_AR,...MAKERS_EN].map(normVehicleText));
const MODEL_SET=new Set(MODELS_AR.concat(MODELS_EN).map(normVehicleText));
function detect(w){
  const H=w.heads,n=H.length,rows=w.data.slice(0,Math.min(800,w.data.length));
  const headerKey=t=>normVehicleText(t).replace(/\s+/g,"");
  const isNonVehicleHeader=t=>/(شهاده|الشهاده|نوعالشهاده|certificate|contract|عقد|مده|اشهر|شهور|متتاليه|قسط|دفعات|تأخير|تاخير|تعثر|ملاحظات|حاله|status|payment)/i.test(headerKey(t));
  // Some wallets store manufacturer and vehicle type together in ASTASSETS or Car (e.g. HYUNDAI ELANTRA or فاو , تي 77 واجن).
  const assetsi=H.findIndex((t,c)=>c!==w.pi&&/^(astassets|vehicleassets|assetdescription|vehicle_description|car)$/i.test(headerKey(t)));
  const frac=(c,re)=>{let k=0,t=0;rows.forEach(r=>{const v=String(r[c]==null?"":r[c]).trim();if(v){t++;if(re.test(v.replace(/\s/g,"")))k++}});return t?k/t:0};
  const vals=c=>rows.map(r=>String(r[c]==null?"":r[c]).trim()).filter(Boolean);
  const scoreDict=(c,set)=>{const a=vals(c);if(!a.length)return 0;let k=0;a.forEach(v=>{if(set.has(normVehicleText(v)))k++});return k/a.length};
  const YR=/^(19|20)\d\d$/;
  let ci=H.findIndex((t,c)=>c!==w.pi&&RX_C.test(t));
  if(ci<0){let b=0;for(let c=0;c<n;c++)if(c!==w.pi){const f=frac(c,/^[A-Z0-9]{17}$/i);if(f>b){b=f;ci=c}}if(b<.5)ci=-1}
  let yi=H.findIndex((t,c)=>c!==w.pi&&c!==ci&&!isNonVehicleHeader(t)&&/year|سنهالصنع|سنه|موديلالصنع|manufactureyear/i.test(headerKey(t)));
  if(yi<0){let b=0;for(let c=0;c<n;c++)if(c!==w.pi&&c!==ci){const f=frac(c,YR);if(f>b){b=f;yi=c}}if(b<.5)yi=-1}
  // Prefer explicit manufacturer headers; never mistake certificate/contract fields for vehicle data.
  let makei=H.findIndex((t,c)=>c!==w.pi&&c!==ci&&c!==yi&&!isNonVehicleHeader(t)&&/(manufacturer|make|brand|مصنع|صانعالمركبه|صانع|الشركهالمصنعه|الماركه)/i.test(headerKey(t)));
  // Prefer the vehicle's type/model column over generic "type" fields such as certificate type.
  const typeHeaderScore=t=>{
    const h=headerKey(t);if(isNonVehicleHeader(t))return -1;
    if(/نوعالمركبه|طرازالمركبه|vehiclemodel|vehicletype|car_model|carmodel/.test(h))return 10;
    if(/طراز|فئهالمركبه|vehiclevariant/.test(h))return 8;
    if(/نوع|model|type/.test(h))return 5;
    return -1;
  };
  let bi=-1,bh=-1;
  for(let c=0;c<n;c++)if(![w.pi,ci,yi,makei].includes(c)){const sc=typeHeaderScore(H[c]);if(sc>bh){bh=sc;bi=c}}
  if(bh<0)bi=-1;
  if(makei<0||bi<0){
    let bestMake={c:-1,s:0},bestModel={c:-1,s:0};
    for(let c=0;c<n;c++)if(c!==w.pi&&c!==ci&&c!==yi&&!isNonVehicleHeader(H[c])){
      const ms=scoreDict(c,MAKER_SET),ts=scoreDict(c,MODEL_SET);
      if(ms>bestMake.s)bestMake={c,s:ms};if(ts>bestModel.s)bestModel={c,s:ts};
    }
    if(makei<0&&bestMake.s>=.12)makei=bestMake.c;
    if(bi<0&&bestModel.s>=.12)bi=bestModel.c;
  }
  // Final guard: the same source column cannot serve as both manufacturer and vehicle type.
  if(makei===bi)bi=-1;
  // Treat ASTASSETS as the detected vehicle type field for status/diagnostics as well.
  if(assetsi>=0){bi=assetsi;makei=-1;}
  w.ci=ci;w.yi=yi;w.makei=makei;w.bi=bi;w.mi=-1;w.assetsi=assetsi;
}
function vehicleTypeValue(w,r){
  // ASTASSETS or Car contains the manufacturer and vehicle type together; normalize the separator and never append the year column.
  if(w.assetsi>=0){
    const combined=String(r[w.assetsi]==null?"":r[w.assetsi]).trim();
    if(combined&&!/^(بدون|لا\s*يوجد|غير\s*(موجود|محدد)|-+|—|n\/?a|null|none)$/i.test(combined)){
      const pair=combined.split(/\s*[,،;|]\s*/).map(x=>x.trim()).filter(Boolean);
      return pair.length>1?pair.join(" / "):combined;
    }
  }
  // Output manufacturer + vehicle type only. Year/model-year and certificate type are intentionally excluded.
  const indexes=[w.makei,w.bi];
  const bad=/^(بدون|لا\s*يوجد|غير\s*(موجود|محدد)|-+|—|n\/?a|null|none)$/i;
  const parts=[];
  indexes.forEach(x=>{
    if(x<0)return;
    const v=String(r[x]==null?"":r[x]).trim();
    if(!v||bad.test(v)||/ثلاثة?\s*اشهر|أ?شهر\s*متتالية|نوع\s*الشهادة|certificate|contract/i.test(v))return;
    if(!parts.some(p=>normVehicleText(p)===normVehicleText(v)))parts.push(v);
  });
  return parts.join(" / ");
}
function analyze(w){
  w.found=new Map();w.nf=0;
  w.data.forEach(r=>{
    const k=norm(r[w.pi]).key,s=S.idx.get(k);
    if(!k){return}
    if(!s){w.nf++;return}
    s.forEach(o=>{if(!w.found.has(o))w.found.set(o,new Set());w.found.get(o).add(k)});
  });
  w.owners=[...w.found.keys()].sort((a,b)=>w.found.get(b).size-w.found.get(a).size);detect(w);
}

function mapCols(w){
  const nh=s=>String(s).replace(/\s+/g,"").toLowerCase(),wh=w.heads.map(nh),m=[];
  S.heads.forEach((H,c)=>{
    const h=nh(H);let j=-1;
    if(c+1===S.pc)j=-2;else if(c+1===S.oc)j=-3;
    else if(RX_C.test(H)&&w.ci>=0)j=-4;
    else if(/^(ال)?نوع(السيارة|المركبة)?$/.test(h)&&(w.makei>=0||w.bi>=0||w.mi>=0||w.yi>=0))j=-5;
    else{
      if(h)j=wh.findIndex(x=>x&&x===h);
      if(j<0&&h)j=wh.findIndex(x=>x&&(x.includes(h)||h.includes(x)));
      if(j<0&&RX_C.test(H))j=w.heads.findIndex(x=>RX_C.test(x));
    }
    m.push(j);
  });
  return m;
}

    if(bad.length||leftDm>0){
      log("⚠️ فشل التحقق: بعد الحذف لسه فيه صفوف قديمة ("+bad.map(([o,n])=>o+": "+n).join("، ")+(leftDm?" · مطابقة متبقية: "+leftDm:"")+").\nماتمش اعتماد أي حاجة، والشيت الأساسي زي ما هو. ابعتلي الرسالة دي.");
      S.wb=null;S.ws=null;$("applyBtn").disabled=false;return;
    }
    S._verify=[...before].map(([o,n])=>o+": كان "+n+" صف ← اتمسح كله");
  }
  const RU=new Map();
  let fixed=0;
  for(let r=S.h+1;r<=ws.rowCount;r++){
    const cell=ws.getCell(r,S.pc),t=ctext(cell);
    if(t&&/[A-Za-z]/.test(t)){const z=norm(t);if(z.key){cell.value=z.L+z.D;fixed++}}
  }
  S._fixed=fixed;
  const last=ws.getRow(ws.rowCount),tpl=S.heads.map((_,c)=>JSON.parse(JSON.stringify(last.getCell(c+1).style||{})));
  let added=0,skippedDuplicates=0;
  const existingByOwner=new Map(),existingRowsByOwnerKey=new Map();
  for(let r=S.h+1;r<=ws.rowCount;r++){
    const row=ws.getRow(r),owner=ctext(row.getCell(S.oc)),key=norm(ctext(row.getCell(S.pc))).key;
    if(!owner||!key)continue;
    if(!existingByOwner.has(owner))existingByOwner.set(owner,new Set());
    existingByOwner.get(owner).add(key);
    if(!existingRowsByOwnerKey.has(owner))existingRowsByOwnerKey.set(owner,new Map());
    const byKey=existingRowsByOwnerKey.get(owner);if(!byKey.has(key))byKey.set(key,[]);byKey.get(key).push(r);
  }
  for(const w of W){
    if(w.mode==="del")continue;
    const m=mapCols(w),ownerKeys=existingByOwner.get(w.name2)||new Set(),typeDest=m.findIndex(j=>j===-5)+1;
    existingByOwner.set(w.name2,ownerKeys);
    if(!existingRowsByOwnerKey.has(w.name2))existingRowsByOwnerKey.set(w.name2,new Map());
    const ownerRows=existingRowsByOwnerKey.get(w.name2);
    const excludedKeys=new Set();
    (w.excludeOwnersSelected||[]).forEach(owner=>{const keys=w.found.get(owner);if(keys)keys.forEach(k=>excludedKeys.add(k))});
    for(const r of w.data){
      const z=norm(r[w.pi]);if(!z.key)continue;
      if(excludedKeys.has(z.key)){skippedDuplicates++;continue}
      if(ownerKeys.has(z.key)){
        const suppliedType=w.isPasted?(w.bi>=0?String(r[w.bi]==null?"":r[w.bi]).trim():""):vehicleTypeValue(w,r);
        if(suppliedType&&typeDest>0)(ownerRows.get(z.key)||[]).forEach(rr=>{ws.getRow(rr).getCell(typeDest).value=suppliedType});
        skippedDuplicates++;continue;
      }
      ownerKeys.add(z.key);
      const plate=z.L+z.D;
      const vals=m.map(j=>{
        if(j===-2)return plate;if(j===-3)return w.name2;
        if(j===-4)return String(r[w.ci]==null?"":r[w.ci]).replace(/\s/g,"").toUpperCase();
        if(j===-5)return vehicleTypeValue(w,r);
        if(j<0)return "";
        const v=String(r[j]).trim();
        return /^-?\d{1,12}(\.\d+)?$/.test(v)?Number(v):v;
      });
      const row=ws.addRow(vals);
      tpl.forEach((st,c)=>{row.getCell(c+1).style=st});
      if(!ownerRows.has(z.key))ownerRows.set(z.key,[]);ownerRows.get(z.key).push(row.number);
      added++;
      if(z.L&&z.D&&!RU.has(w.name2))RU.set(w.name2,{o:w.name2,p:plate,k:z.key,n:row.number});
    }
  }
  // آخر 3 ملاك اتحدّثوا: لوحة من كل واحد تتكتب في أول الصفحة الأولى علشان تنوّر
  try{
    let prevR=[];try{const mm=/^RZ:([\s\S]*)$/.exec(S.wb.keywords||"");if(mm)prevR=JSON.parse(mm[1])}catch(e){}
    const gone=e=>all.includes(e.o)||(dmAll.includes(e.o)&&W.some(w=>{const f=w.found.get(e.o);return f&&f.has(e.k)}));
    const cur=[...RU.values()].reverse(),names=new Set(cur.map(e=>e.o));
    const keep=prevR.filter(e=>e&&e.o&&e.k&&!names.has(e.o)&&!gone(e));
    const need=new Map(keep.map(e=>[e.k,e]));
    for(let r=S.h+1;r<=ws.rowCount&&need.size;r++){const k=norm(ctext(ws.getRow(r).getCell(S.pc))).key;const e=need.get(k);if(e){e.n=r;need.delete(k)}}
    const recent=[...cur,...keep].filter(e=>e.n).slice(0,3);
    recent.forEach(e=>{const rw=ws.getRow(e.n);e.v=[1,2,3,4].map(c=>{const v=rw.getCell(c).value;return v==null?"":String(v&&typeof v==="object"&&v.text?v.text:v)})});
    S._recent=recent;
    S.wb.keywords="RZ:"+JSON.stringify(recent.map(e=>({o:e.o,p:e.p,k:e.k})));
  }catch(e){console.error(e);S._recent=[]}
  try{designSheet(S.wb)}catch(e){console.error(e)}
  try{
    S.out=new Uint8Array(await S.wb.xlsx.writeBuffer());S.bytes=S.out;S.fileName="النسخة المحدثة بعد التنفيذ";
    log("تم. حُذف "+rs.length+" صف، وأُضيف "+added+" صف، وتم تخطي "+skippedDuplicates+" لوحة مكررة عند نفس المالك.\n"+(S._verify||[]).join("\n")+(S._fixed?"\nتصحيح "+S._fixed+" لوحة إنجليزي إلى حروف عربي في الأساسي":"")+"\nراجع الملف قبل الاعتماد، خصوصاً الأعمدة التي بها معادلات.");
    try{await DB.set("main",S.out)}catch(e){}$("dlBtn").hidden=false;buildIndex();W=[];renderWallets();$("walf").value="";$("walInfo").textContent="";$("applyBtn").disabled=false;$("applyBox").hidden=false;log($("log").textContent+"\nالنتيجة اتعتمدت كشيت أساسي جديد. ارفع المحفظة التالية أو نزّل الملف.");
  }catch(err){log("خطأ أثناء إنشاء الملف: "+err.message)}
};

const XMIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
function saveFile(bytes){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([bytes],{type:XMIME}));
  a.download="تشييك Rasd Zaki.xlsx";document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
async function shareFile(bytes){
  const f=new File([bytes],"تشييك Rasd Zaki.xlsx",{type:XMIME});
  if(navigator.canShare&&navigator.canShare({files:[f]})){
    try{await navigator.share({files:[f],title:"Rasd Zaki"});return}
    catch(e){if(e&&e.name==="AbortError")return}
  }
  saveFile(bytes);
  alert("كروم مابيسمحش بمشاركة ملفات إكسل مباشرة من الموقع.\nنزّلت الملف في التنزيلات باسم Rasd Zaki.xlsx\nافتح تطبيق «الملفات» ← التنزيلات، اضغط على الملف مطولاً ← مشاركة ← واتساب.");
}
$("dlBtn").onclick=()=>{if(S&&S.out)shareFile(S.out)};
$("saveBtn").onclick=async()=>{
  let b=null;
  try{b=await DB.get("main")}catch(e){}
  if(!b&&S&&S.bytes)b=S.bytes;
  if(!b){alert("مفيش شيت محفوظ لسه. ارفع الشيت الأساسي أو نفّذ دمج الأول.");return}
  shareFile(b instanceof Uint8Array?b:new Uint8Array(b));
};
const DB={open(){return new Promise((res,rej)=>{const q=indexedDB.open("wm",1);q.onupgradeneeded=()=>q.result.createObjectStore("f");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
async set(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction("f","readwrite");t.objectStore("f").put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction("f").objectStore("f").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}};
function designSheet(wb){
  const ws=wb.worksheets[0];
  if(!ws||ws===S.ws)return;
  // مهم: ExcelJS بيشارك نفس كائن الستايل بين خلايا كتير، فنعمل كائن جديد لكل خلية بدل التعديل المباشر
  const st=(c,patch)=>{c.style=Object.assign({},c.style,patch)};
  const solid=a=>({type:"pattern",pattern:"solid",fgColor:{argb:a},bgColor:{argb:a}});
  const none={type:"pattern",pattern:"none"};
  try{ws.name="تشييك"}catch(e){}
  const CW={A:20.2,B:0.6,C:16.8,D:34.1,E:32.7,F:39.8};
  Object.keys(CW).forEach(k=>{ws.getColumn(k).width=CW[k]});
  [[1,33.75],[2,34.5],[3,30]].forEach(([r,h])=>{ws.getRow(r).height=h});
  try{ws._media=[]}catch(e){}
  // صفوف البيانات: نرجّعها للشكل الأصلي (من غير خلفية، ويصلّح أي تلوين قديم اتسرّب)
  const last=Math.min(ws.rowCount,4999);
  for(let r=4;r<=last;r++){
    for(let c=1;c<=6;c++){
      st(ws.getCell(r,c),Object.assign({font:{name:"Calibri",size:20,bold:true},fill:c===2?solid("FFFFFF00"):none,alignment:{horizontal:"center",vertical:"middle"}},c===2?{numFmt:";;;"}:{}));
    }
  }
  // معادلات أسرع: بحث واحد لكل لوحة (عمود B المخفي) والباقي INDEX، والصفوف الفاضية بتتخطى
  let anyFilled=false;
  const RC=S._recent||[];
  RC.forEach((e,i)=>{ws.getCell(4+i,1).value=e.p});
  for(let r=4;r<=4999;r++){
    const rc=RC[r-4];
    const av=ws.getCell(r,1).value,empty=av==null||String(av).trim()==="";
    if(!empty&&!rc)anyFilled=true;
    const put=(c,f,res)=>{const old=c.value;c.value={formula:f,result:empty?"":(res!==undefined?res:(old&&old.result!==undefined?old.result:""))}};
    put(ws.getCell("B"+r),`IF(A${r}="","",IFERROR(MATCH(A${r},بيانات!A:A,0),""))`,rc?rc.n:"");
    [["C","A",0],["D","B",1],["E","C",2],["F","D",3]].forEach(([L,src,ix])=>{
      put(ws.getCell(L+r),`IF(B${r}="","",INDEX(بيانات!${src}:${src},B${r}))`,rc&&rc.v?rc.v[ix]:undefined);
    });
  }
  try{wb.calcProperties=Object.assign({},wb.calcProperties,{calcId:191029,fullCalcOnLoad:anyFilled})}catch(e){}
  // الصف الأول
  try{if(!ws.getCell("A1").isMerged)ws.mergeCells("A1:F1")}catch(e){}
  const a1=ws.getCell("A1");
  a1.value="Rasd Zaki";
  st(a1,{font:{name:"Arial",size:20,bold:true,color:{argb:"FFFFFFFF"}},fill:solid("FF0070C0"),alignment:{horizontal:"center",vertical:"middle"}});
  // صف العناوين
  const HF={A:"FF335324",B:"FFFFFF00",C:"FF4CA65E",D:"FF4EACEA",E:"FFFFFF56",F:"FF7030A0"};
  const HFC={A:"FFFFFFFF",B:"FF000000",C:"FF000000",D:"FF000000",E:"FF000000",F:"FFFFFFFF"};
  Object.keys(HF).forEach(k=>{
    const c=ws.getCell(k+"2");
    st(c,{fill:solid(HF[k]),font:Object.assign({},c.font,{name:"Abadi",size:k==="D"?20:24,color:{argb:HFC[k]}})});
  });
  // صف "صل على محمد": 3 مرات جنب بعض على لون وردي غامق
  const ROSE="FFC2185B";
  try{ws.unMergeCells("A3:F3")}catch(e){}
  for(let c=1;c<=6;c++){const x=ws.getCell(3,c);x.value=null;st(x,{fill:solid(ROSE)})}
  const a3=ws.getCell("A3");
  a3.value="صل على محمد        صل على محمد        صل على محمد";
  st(a3,{font:{name:"Calibri",size:22,bold:true,italic:true,color:{argb:"FFFFFFFF"}},fill:solid(ROSE),alignment:{horizontal:"center",vertical:"middle"}});
  try{ws.mergeCells("A3:F3")}catch(e){}
  // ألوان اللوحة لما تنور (قاعدة بسيطة لكل عمود)
  const CM={C:"FF4CA65E",D:"FF4EACEA",E:"FFFFFF56",F:"FF7030A0"};
  ws.conditionalFormattings=[];
  Object.keys(CM).forEach((L,i)=>{
    ws.addConditionalFormatting({ref:L+"4:"+L+"4999",rules:[{type:"expression",priority:i+1,formulae:[L+'4<>""'],style:Object.assign({fill:{type:"pattern",pattern:"solid",bgColor:{argb:CM[L]}}},L==="F"?{font:{color:{argb:"FFFFFFFF"}}}:{})}]});
  });
}
async function fastRestore(){
  const [b,ix]=await Promise.all([DB.get("main"),DB.get("index")]);
  if(!b||!ix||!ix.dump||ix.v!==4)return false;
  S={fileName:ix.name,bytes:b instanceof Uint8Array?b:new Uint8Array(b),heads:ix.heads,h:ix.h,sheetName:ix.sheetName,pc:ix.pc,oc:ix.oc,ar:ix.ar,idx:new Map(),byOwner:new Map(),dump:ix.dump};
  ix.dump.forEach(([r,k,o])=>{
    if(!S.idx.has(k))S.idx.set(k,new Set());S.idx.get(k).add(o);
    if(!S.byOwner.has(o))S.byOwner.set(o,[]);S.byOwner.get(o).push(r);
  });
  const opts=S.heads.map((t,i)=>'<option value="'+(i+1)+'">'+esc(t||"عمود "+(i+1))+"</option>").join("");
  $("pcol").innerHTML=opts;$("ocol").innerHTML=opts;$("pcol").value=S.pc;$("ocol").value=S.oc;$("cols").hidden=true;
  $("mainInfo").innerHTML='<span class="ok">تم تحميل آخر شيت محفوظ: '+ix.dump.length+" صف ("+S.idx.size+" لوحة مختلفة)، "+S.byOwner.size+" مالك<br>الملف: "+esc(ix.name||"محفوظ")+(ix.at?" · آخر حفظ: "+new Date(ix.at).toLocaleString("ar-EG"):"")+"</span>";
  $("dl").innerHTML=[...S.byOwner.keys()].map(o=>'<option value="'+esc(o)+'">').join("");
  $("walf").disabled=false;$("restoreBtn").hidden=true;
  return true;
}
(async()=>{try{if(await fastRestore())return;const b=await DB.get("main");if(b){$("restoreBtn").hidden=false;$("restoreBtn").onclick=()=>{$("restoreBtn").hidden=true;$("mainf").onchange({target:{files:[new File([b],"saved.xlsx")]}})}}}catch(e){}})();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
(async()=>{
 if(!/[?&]shared=1/.test(location.search))return;
 try{
  const c=await caches.open("shared"),k=new URL("shared-file",document.baseURI).href,r=await c.match(k);
  if(!r)return;
  const f=new File([await r.blob()],decodeURIComponent(r.headers.get("x-name")||"shared.xlsx"));

  const m=document.createElement("div");

  document.body.appendChild(m);m.querySelector("#shn").textContent=f.name;
  m.querySelector("#shM").onclick=async()=>{m.remove();try{const dt=new DataTransfer();dt.items.add(f);$("mainf").files=dt.files}catch(e){}await $("mainf").onchange({target:{files:[f]}})};
  m.querySelector("#shW").onclick=async()=>{m.remove();
   if(!S&&!(await fastRestore())){const b=await DB.get("main");if(b)await $("mainf").onchange({target:{files:[new File([b],"saved.xlsx")]}})}
   if(!S){alert("ارفع الشيت الأساسي أولاً");return}
   try{const dt=new DataTransfer();dt.items.add(f);$("walf").files=dt.files}catch(e){}
   await $("walf").onchange({target:{files:[f]}})};
 }catch(e){}
})();
$("pasteBtn").onclick=()=>{
  if(!S){alert("حمّل الشيت الأساسي أولاً");return}
  const lines=$("paste").value.split(/\r?\n/).map(l=>l.replace(/\s+$/,"")).filter(l=>l.trim());
  if(!lines.length){alert("الصق اللوحات أولاً");return}
  const tab=lines.some(l=>l.includes("\t"));
  const rows=tab?lines.map(l=>l.split("\t").map(x=>x.trim())):lines.map(l=>[l.trim()]);
  const n=Math.max(...rows.map(r=>r.length));
  let heads,data=rows,pi=0;
  if(rows[0].some(t=>RX_P.test(t)||RX_C.test(t))){
    heads=rows[0];data=rows.slice(1);pi=pickPlateCol(heads,data,heads.map((t,c)=>RX_P.test(t)?c:-1).filter(c=>c>=0));if(pi<0)pi=0;
  }else{
    heads=Array.from({length:n},(_,i)=>i===0?"اللوحة":"عمود "+(i+1));
    if(tab){pi=pickPlateCol(heads,data,[]);if(pi<0)pi=0}
  }
  data=data.map(r=>{r=r.slice();while(r.length<heads.length)r.push("");return r});
  let typeCol=heads.findIndex(t=>/^(ال)?نوع(\s*(السيارة|المركبة))?$|ماركة|ماركه|make|brand|vehicle|car\s*type/i.test(String(t||"").trim()));
  if(typeCol<0){typeCol=heads.length;heads=[...heads,"النوع"];data=data.map(r=>{r.push("");return r})}
  const mode=$("pasteMode").value;
  const w={name:(mode==="del"?"حذف لوحات ملصوقة (":"إضافة لوحات ملصوقة (")+new Date().toLocaleTimeString("ar-EG")+")",heads,data,pi,isPasted:true,mode:mode==="add"?undefined:"del",pasteIntent:mode,selectedOwners:new Set()};
  W.push(w);analyze(w);renderWallets();
  $("walInfo").textContent="تمت إضافة "+data.length+" صف من اللصق";
  $("paste").value="";
};
